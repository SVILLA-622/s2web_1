<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template 1</title>
</head>
<body>
    <div class="card" id="book-card">
        <!-- Do not hardcode the content here, use JavaScript -->
    </div>

    <style>
        /* Card styling */
        .card {
            width: 300px;
            border: 1px solid #333;
            color: #333;
            padding: 20px;
            box-sizing: border-box;

            /* Flexbox */
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card h2 {
            font-size: 1.5em;
            text-transform: uppercase;
            margin: 0;
        }

        .card h3 {
            text-transform: uppercase;
            margin: 0;
        }

        .card p {
            margin: 5px 0;
        }

        .genres {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .genre {
            background-color: #eee;
            padding: 5px 8px;
            border-radius: 5px;
        }
    </style>

    <script>
        const book = {
            "id": 42,
            "title": "The Hitchhiker's Guide to the Galaxy",
            "author": "Douglas Adams",
            "year": 1979,
            "genres": ["Science Fiction", "Comedy", "Adventure"],
            "pages": 224,
            "language": "English",
            "imageUrl": "https://images-na.ssl-images-amazon.com/images/I/81XSN3hA5gL.jpg"
        }

        // Your JavaScript here - populate the card with book data
        
        const card = document.querySelector('#book-card');

        card.innerHTML = `
        <img src="${book.imageUrl}" alt="${book.title}"</p>
        <h2>${book.title}</h2>
        <p>Author: ${book.author}</p>
        <p>Year: ${book.year}</p>
        <p id="genres">Genres: </p> 
        <p>Pages: ${book.pages}</p>
        <p>Language: ${book.language}</p>
               `

        const bookGenre = document.querySelector("#genres")
        book.genres.forEach((genre)=>{
          bookGenre.textContent += genre + ", " 
        })
        console.log(bookGenre.textContent)

    </script>
 
</body>
</html>
