<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Template 1</title>



    <style>

        /* Card styling */

        .card {

            width: 300px;

            border: 1px solid #333;

            color: #333;

            padding: 20px;

            box-sizing: border-box;



            /* Flexbox */

            display: flex;

            flex-direction: column;

            gap: 10px;

        }



        .card img {

            width: 100%;

            height: 200px;

            object-fit: cover;

        }



        .card h2 {

            font-size: 1.5em;

            text-transform: uppercase;

            margin: 0;

        }



        .card h3 {

            text-transform: uppercase;

            margin: 0;

        }



        .card p {

            margin: 5px 0;

        }



        .genres {

            display: flex;

            flex-wrap: wrap;

            gap: 5px;

        }



        .genre {

            background-color: #eee;

            padding: 5px 8px;

            border-radius: 5px;

        }

    </style>

</head>



<body>



    <div class="card" id="book-card">

        <!-- JavaScript will add everything here -->

    </div>



    <script>



        const book = {

            "id": 42,

            "title": "The Hitchhiker's Guide to the Galaxy",

            "author": "Douglas Adams",

            "year": 1979,

            "genres": ["Science Fiction", "Comedy", "Adventure"],

            "pages": 224,

            "language": "English",

            "imageUrl": "https://images-na.ssl-images-amazon.com/images/I/81XSN3hA5gL.jpg"

        };



        // Get the card

        const card = document.getElementById("book-card");



        // Create image

        const image = document.createElement("img");

        image.src = book.imageUrl;

        image.alt = book.title;



        // Create title

        const title = document.createElement("h2");

        title.textContent = book.title;



        // Create author

        const author = document.createElement("h3");

        author.textContent = book.author;



        // Create year

        const year = document.createElement("p");

        year.textContent = "Year: " + book.year;



        // Create pages

        const pages = document.createElement("p");

        pages.textContent = "Pages: " + book.pages;



        // Create language

        const language = document.createElement("p");

        language.textContent = "Language: " + book.language;



        // Create genres container

        const genresContainer = document.createElement("div");

        genresContainer.className = "genres";



        // Loop through genres

        book.genres.forEach(function(genre) {



            const genreElement = document.createElement("span");



            genreElement.className = "genre";



            genreElement.textContent = genre;



            genresContainer.appendChild(genreElement);

        });



        // Add everything to the card

        card.appendChild(image);

        card.appendChild(title);

        card.appendChild(author);

        card.appendChild(year);

        card.appendChild(pages);

        card.appendChild(language);

        card.appendChild(genresContainer);



    </script>



</body>

</html>
